name: release
# Publishes to Maven Central when a vX.Y.Z tag is pushed. Central has no trusted
# publishing (OIDC), so this needs a Central Portal user token and a GPG key as secrets.
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Tag must match build.gradle.kts version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          actual=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$actual" != "$TAG" ]; then
            echo "::error::$TAG does not match build.gradle.kts version ($actual)"
            exit 1
          fi
      - run: ./gradlew spotlessCheck build
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
