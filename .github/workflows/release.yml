name: release
# Publishes to Maven Central when a vX.Y.Z tag is pushed. Central has no trusted
# publishing (OIDC), so this needs a Central Portal user token and a GPG key as secrets.
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Tag must match build.gradle.kts version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          actual=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$actual" != "$TAG" ]; then
            echo "::error::$TAG does not match build.gradle.kts version ($actual)"
            exit 1
          fi
      - run: ./gradlew spotlessCheck build
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache
