name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1' # weekly auto-prune of the snooze baseline
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@e71482dfb5914417d9675f1be1c6dd34699d0922 # v2.14.0
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: '.'
      # PMD comes from mise.toml's setup:pmd postinstall, which `mise install` runs here.
      habit_hooks_plugin: 'habit-hooks-java'
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
    permissions: { contents: write, pull-requests: write }
