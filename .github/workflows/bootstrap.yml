name: bootstrap
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1' # weekly auto-prune of the snooze baseline
jobs:
  bootstrap:
    uses: CMaintz/foundry/.github/workflows/bootstrap.yml@ad286d83af4094a74c3a0ff7b0390a14d88ba801 # v2.8.0
    secrets:
      app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
    with:
      working_directory: '.'
      # No habit-hooks-java plugin is wired; structural smells come from the language-
      # independent generic sensor (file-length + jscpd). See .habit-hooks/config.toml.
      habit_hooks_plugin: 'habit-hooks-generic'
      app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
    permissions: { contents: write, pull-requests: write }
