name: gate
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Self-contained: Foundry's reusable _java.yml gate expects the PMD/no-var +
# foundry-verb-wrap infra that this single-package library does not carry. So this
# mirrors `mise run gate` for Java directly: lint -> typecheck -> test -> audit.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # lint (Spotless format check) + typecheck (compile, javadoc with doclint as errors)
      - run: ./gradlew spotlessCheck compileJava javadoc
      # test + jacoco coverage floor
      - run: ./gradlew test jacocoTestCoverageVerification
      # audit: scan the committed lockfile with a pinned osv-scanner (lock drift already fails compile/test resolution above)
      - name: audit (osv-scanner)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x "$RUNNER_TEMP/osv-scanner"
          ./gradlew dependencies > /dev/null
          "$RUNNER_TEMP/osv-scanner" --lockfile=gradle.lockfile
