# No habit-hooks-java (PMD) plugin is wired here - this single-package library keeps
# the gate self-contained. Structural smells come from the language-independent
# `generic` plugin (file-length + jscpd duplication); style is enforced by Spotless
# in `mise run lint`.
plugins = ["generic"]

# Tests are not smell-scanned (language-agnostic principle - see README).
files = ["**/*.java", "!**/src/test/**", "!**/build/**"]

# File-length: flag files over 300 lines (oversized-file).
[sensors.line-count]
args = ["--max", "300"]
